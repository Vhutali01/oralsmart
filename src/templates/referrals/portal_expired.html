<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referral Expired or Not Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .error-container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
        }
        .error-icon {
            font-size: 100px;
            color: #dc3545;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <i class="fas fa-exclamation-triangle"></i>
        </div>
        <h1>Referral Not Found or Expired</h1>
        <p class="lead mt-3">
            This referral link is either invalid, has expired, or has been removed.
        </p>
        <p class="text-muted">
            Referral links are valid for 30 days from creation. If you believe you should have access to this referral, 
            please contact the referring healthcare provider.
        </p>
        <div class="mt-4">
            <a href="/" class="btn btn-primary">Return to Home</a>
        </div>
    </div>
</body>
</html>
