{% load static %}

<style>
.profile-avatar {
    background-color: #f8f9fa;
    border: 2px solid #e9ecef;
    transition: all 0.2s ease;
}

.profile-avatar:hover {
    border-color: #007bff;
    transform: scale(1.05);
}

/* Placeholder while image loads */
.profile-avatar[src=""], .profile-avatar:not([src]) {
    background-image: url('{% static "images/default/default_profile_pic.jpg" %}');
    background-size: cover;
    background-position: center;
}

/* Active navigation link styling */
.nav-link.active {
    color: #000 !important;
    font-weight: 500;
}

.nav-link {
    color: #6c757d;
    transition: color 0.2s ease;
}

.nav-link:hover {
    color: #495057;
}
</style>

<!-- Navbar -->
<nav class="navbar navbar-light navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <a class="navbar-brand mt-2 mt-lg-0" href="#">
                <img {% load static %} src="{% static 'images/Logo2.png' %}" height="60" alt="oralsmart logo" loading="lazy" />
            </a>
            
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0 justify-content-center">
                <li class="nav-item mx-3">
                    <a class="nav-link {% if request.resolver_match.url_name == 'create_patient' %}active fw-bold{% endif %}" href="{% url 'create_patient' %}">New patient</a>
                </li>
                <li class="nav-item mx-3">
                    <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active fw-bold{% endif %}" href="{% url 'home' %}">Home</a>
                </li>
                <li class="nav-item mx-3">
                    <a class="nav-link {% if request.resolver_match.url_name == 'patient_list' %}active fw-bold{% endif %}" href="{% url 'patient_list' %}">Referrals</a>
                </li>
            </ul>
        </div>

        <div class="d-flex align-items-center">
            <!-- Notification Bell -->
            <div class="dropdown me-3">
                <a href="#" 
                   class="position-relative text-decoration-none" 
                   id="notificationDropdown" 
                   data-bs-toggle="dropdown" 
                   aria-expanded="false"
                   title="Notifications">
                    <i class="fas fa-bell fa-lg text-secondary"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" 
                          id="notificationBadge" 
                          style="display: none; font-size: 0.7rem;">
                        0
                    </span>
                </a>
                
                <ul class="dropdown-menu dropdown-menu-end shadow" 
                    aria-labelledby="notificationDropdown" 
                    style="width: 350px; max-height: 400px; overflow-y: auto;">
                    <li class="dropdown-header d-flex justify-content-between align-items-center">
                        <span class="fw-bold">Notifications</span>
                        <button class="btn btn-sm btn-link text-decoration-none p-0" 
                                id="markAllReadBtn" 
                                onclick="markAllAsRead()" 
                                style="display: none;">
                            Mark all as read
                        </button>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <div id="notificationList">
                        <li class="text-center py-3 text-muted">
                            <i class="fas fa-check-circle fa-2x mb-2"></i>
                            <p class="mb-0">No new notifications</p>
                        </li>
                    </div>
                    <li><hr class="dropdown-divider"></li>
                    <li class="text-center">
                        <a class="dropdown-item text-primary" href="{% url 'notifications:page' %}">
                            View all notifications
                        </a>
                    </li>
                </ul>
            </div>

            <div class="dropdown">
                <a href="#" class="d-flex align-items-center" data-bs-toggle="offcanvas" data-bs-target="#offcanvasProfile" aria-controls="offcanvasProfile">
                    <img src="{{ request.user.profile.profile_picture_url }}" 
                         class="rounded-circle img-fluid profile-avatar" 
                         alt="avatar" 
                         style="width: 70px; height: 70px; object-fit: cover;" />
                </a>
            </div>
        </div>
    </div>
</nav>

<!-- Include Profile Drawer -->
{% include "profile_drawer.html" %}

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Handle profile picture loading errors
    const profileAvatars = document.querySelectorAll('.profile-avatar');
    const defaultImageUrl = '{% static "images/default/default_profile_pic.jpg" %}';
    
    profileAvatars.forEach(function(img) {
        img.addEventListener('error', function() {
            this.src = defaultImageUrl;
        });
        
        // Preload the image for faster loading
        if (img.src && img.src !== defaultImageUrl) {
            const preloadImg = new Image();
            preloadImg.onload = function() {
                // Image loaded successfully
            };
            preloadImg.onerror = function() {
                img.src = defaultImageUrl;
            };
            preloadImg.src = img.src;
        }
    });
    
    // Notification system
    loadNotifications();
    
    // Poll for new notifications every 30 seconds
    setInterval(loadNotifications, 30000);
});

function loadNotifications() {
    fetch('/notifications/api/count/')
        .then(response => response.json())
        .then(data => {
            const badge = document.getElementById('notificationBadge');
            const markAllBtn = document.getElementById('markAllReadBtn');
            
            if (data.count > 0) {
                badge.textContent = data.count > 99 ? '99+' : data.count;
                badge.style.display = 'inline-block';
                markAllBtn.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
                markAllBtn.style.display = 'none';
            }
        })
        .catch(error => console.error('Error loading notification count:', error));
}

function loadNotificationList() {
    fetch('/notifications/api/list/?limit=5')
        .then(response => response.json())
        .then(data => {
            const notificationList = document.getElementById('notificationList');
            
            if (data.notifications.length === 0) {
                notificationList.innerHTML = `
                    <li class="text-center py-3 text-muted">
                        <i class="fas fa-check-circle fa-2x mb-2"></i>
                        <p class="mb-0">No new notifications</p>
                    </li>
                `;
                return;
            }
            
            let html = '';
            data.notifications.forEach(notification => {
                const readClass = notification.is_read ? 'bg-light' : 'bg-white';
                const fontWeight = notification.is_read ? 'fw-normal' : 'fw-bold';
                
                html += `
                    <li>
                        <a href="${notification.action_url}" 
                           class="dropdown-item ${readClass} ${fontWeight} py-2 px-3" 
                           onclick="markAsRead(${notification.id})"
                           style="white-space: normal; border-left: 3px solid var(--bs-${notification.urgency_class});">
                            <div class="d-flex align-items-start">
                                <i class="fas ${notification.icon} text-${notification.urgency_class} me-2 mt-1"></i>
                                <div class="flex-grow-1">
                                    <div class="text-truncate">${notification.title}</div>
                                    <small class="text-muted">${notification.message.substring(0, 60)}...</small>
                                    <br><small class="text-muted">${new Date(notification.created_at).toLocaleString()}</small>
                                </div>
                            </div>
                        </a>
                    </li>
                `;
            });
            
            notificationList.innerHTML = html;
        })
        .catch(error => console.error('Error loading notifications:', error));
}

function markAsRead(notificationId) {
    fetch(`/notifications/api/${notificationId}/read/`, {
        method: 'POST',
        headers: {
            'X-CSRFToken': getCookie('csrftoken'),
            'Content-Type': 'application/json'
        }
    })
    .then(() => loadNotifications())
    .catch(error => console.error('Error marking notification as read:', error));
}

function markAllAsRead() {
    fetch('/notifications/api/mark-all-read/', {
        method: 'POST',
        headers: {
            'X-CSRFToken': getCookie('csrftoken'),
            'Content-Type': 'application/json'
        }
    })
    .then(response => response.json())
    .then(data => {
        loadNotifications();
        loadNotificationList();
    })
    .catch(error => console.error('Error marking all as read:', error));
}

// Load notification list when dropdown is opened
document.getElementById('notificationDropdown')?.addEventListener('click', function(e) {
    if (!this.classList.contains('show')) {
        loadNotificationList();
    }
});

// Helper function to get CSRF token
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
