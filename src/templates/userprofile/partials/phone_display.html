<!-- Phone Display Partial -->
<div class="row" id="phone-section">
    <div class="col-sm-3">
        <p class="mb-0">Phone</p>
    </div>
    <div class="col-sm-9">
        <div class="d-flex justify-content-between align-items-center">
            <p class="text-muted mb-0">{{ phone|default:'No phone number provided' }}</p>
            <button class="btn btn-sm btn-outline-primary" 
                    hx-get="{% url 'edit_phone' %}" 
                    hx-target="#phone-section" 
                    hx-swap="outerHTML"
                    title="Edit phone">
                <i class="fas fa-edit"></i> Edit
            </button>
        </div>
    </div>
</div>
