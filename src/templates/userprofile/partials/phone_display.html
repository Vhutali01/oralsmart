<!-- Phone Display Partial -->
<div class="row" id="phone-section">
    <div class="col-sm-3">
        <p class="mb-0">Phone</p>
    </div>
    <div class="col-sm-8">
        <p class="text-muted mb-0">{{ phone|default:'No phone number provided' }}</p>
    </div>
    <div class="col-sm-1">
        <button class="btn btn-link btn-sm p-0" 
                hx-get="{% url 'edit_phone' %}" 
                hx-target="#phone-section" 
                hx-swap="outerHTML"
                title="Edit phone">
            <i class="fas fa-edit text-secondary"></i>
        </button>
    </div>
</div>
