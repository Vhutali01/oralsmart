<!-- Name Edit Form Partial -->
<div class="row" id="name-section">
    <div class="col-sm-3">
        <p class="mb-0">Full Name</p>
    </div>
    <div class="col-sm-9">
        <form hx-post="{% url 'edit_name' %}" hx-target="#name-section" hx-swap="outerHTML">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-4">
                    {{ form.first_name }}
                    {% if form.first_name.errors %}
                        <div class="text-danger small">{{ form.first_name.errors.0 }}</div>
                    {% endif %}
                </div>
                <div class="col-md-5">
                    {{ form.last_name }}
                    {% if form.last_name.errors %}
                        <div class="text-danger small">{{ form.last_name.errors.0 }}</div>
                    {% endif %}
                </div>
                <div class="col-md-3">
                    <div class="btn-group" role="group">
                        <button type="submit" class="btn btn-primary" title="Save changes">
                            <i class="fas fa-check"></i>
                            <span class="htmx-indicator ms-1">
                                <i class="fas fa-spinner fa-spin"></i>
                            </span>
                        </button>
                        <button type="button" 
                                class="btn btn-outline-secondary"
                                hx-get="{% url 'edit_name' %}?cancel=true" 
                                hx-target="#name-section" 
                                hx-swap="outerHTML"
                                title="Cancel editing">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
