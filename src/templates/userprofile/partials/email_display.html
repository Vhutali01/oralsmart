<!-- Email Display Partial -->
<div class="row" id="email-section">
    <div class="col-sm-3">
        <p class="mb-0">Email</p>
    </div>
    <div class="col-sm-9">
        <div class="d-flex justify-content-between align-items-center">
            <p class="text-muted mb-0">{{ email|default:'No email provided' }}</p>
            <button class="btn btn-sm btn-outline-primary" 
                    hx-get="{% url 'edit_email' %}" 
                    hx-target="#email-section" 
                    hx-swap="outerHTML"
                    title="Edit email">
                <i class="fas fa-edit"></i> Edit
            </button>
        </div>
    </div>
</div>
