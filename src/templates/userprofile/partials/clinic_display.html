<!-- Clinic Affiliation Display Partial -->
<div class="row" id="clinic-section">
    <div class="col-sm-3">
        <p class="mb-0">Affiliated Clinic</p>
    </div>
    <div class="col-sm-9">
        <div class="d-flex justify-content-between align-items-center">
            <p class="text-muted mb-0">{{ affiliated_clinic.name|default:'No clinic affiliation' }}</p>
            <button class="btn btn-sm btn-outline-primary" 
                    hx-get="{% url 'edit_clinic' %}" 
                    hx-target="#clinic-section" 
                    hx-swap="outerHTML"
                    title="Edit clinic">
                <i class="fas fa-edit"></i> Edit
            </button>
        </div>
    </div>
</div>
