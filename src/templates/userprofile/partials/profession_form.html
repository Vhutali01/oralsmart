<!-- Profession Edit Form Partial -->
<div class="row" id="profession-section">
    <div class="col-sm-3">
        <p class="mb-0">Profession</p>
    </div>
    <div class="col-sm-9">
        <form hx-post="{% url 'edit_profession' %}" hx-target="#profession-section" hx-swap="outerHTML">
            {% csrf_token %}
            <div class="input-group">
                {{ form.profession }}
                <div class="input-group-append">
                    <div class="btn-group" role="group">
                        <button type="submit" class="btn btn-primary" title="Save changes">
                            <i class="fas fa-check"></i>
                            <span class="htmx-indicator ms-1">
                                <i class="fas fa-spinner fa-spin"></i>
                            </span>
                        </button>
                        <button type="button" 
                                class="btn btn-outline-secondary"
                                hx-get="{% url 'edit_profession' %}?cancel=true" 
                                hx-target="#profession-section" 
                                hx-swap="outerHTML"
                                title="Cancel editing">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
            </div>
            {% if form.profession.errors %}
                <div class="text-danger small mt-1">{{ form.profession.errors.0 }}</div>
            {% endif %}
        </form>
    </div>
</div>
