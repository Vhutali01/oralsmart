# Locust Configuration File
# This file contains default settings for load testing

# Target host (override with --host parameter)
host = "http://localhost:8000"

# Default test parameters
users = 10          # Total number of concurrent users
spawn_rate = 2      # Users spawned per second
run_time = "5m"     # Test duration

# HTML report settings
html_file = "reports/load_test_report.html"

# CSV stats settings  
csv_prefix = "reports/load_test_stats"

# Logging level
loglevel = "INFO"

# Note: User classes are defined in locustfile.py
# OralSmartUser - Normal user interactions (50% weight)
# ReadOnlyUser - Browse-only operations (40% weight)  
# HeavyUser - Heavy operations like file uploads (10% weight)